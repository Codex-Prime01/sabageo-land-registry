<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Parcel report | SABAGeo Land Registry</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0A1628" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpolygon points='8,12 34,7 37,32 11,37' fill='%23D9A441' fill-opacity='.4' stroke='%230A1628' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("theme") || "dark";
      } catch (e) {}
    </script>
    <style>
      :root {
        --bg: #0a1628;
        --text: #f4f6fa;
        --mute: #9fb0c8;
        --line: rgba(255, 255, 255, 0.12);
        --card: rgba(255, 255, 255, 0.05);
        --brass: #d9a441;
        --clear: #2bff88;
        --flag: #ff2d4d;
        --ease: cubic-bezier(0.22, 0.8, 0.2, 1);
      }
      [data-theme="light"] {
        --bg: #f1f4f9;
        --text: #0a1628;
        --mute: #52627a;
        --line: rgba(10, 22, 40, 0.14);
        --card: rgba(10, 22, 40, 0.04);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family:
          "Public Sans",
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.65;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        padding-top: max(12px, env(safe-area-inset-top));
        background: var(--bg);
        background: color-mix(in srgb, var(--bg) 84%, transparent);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        font-family: "Fraunces", Georgia, serif;
        font-size: 19px;
        font-weight: 700;
      }
      nav {
        margin-left: auto;
        display: flex;
        gap: 4px;
        overflow-x: auto;
      }
      nav a {
        padding: 9px 12px;
        border-radius: 10px;
        color: var(--mute);
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        white-space: nowrap;
        transition:
          background 0.3s,
          color 0.3s;
      }
      nav a:hover {
        color: var(--text);
      }
      nav a.on {
        color: var(--text);
        background: var(--card);
      }
      .map-btn {
        flex: none;
        padding: 9px 14px;
        border-radius: 999px;
        background: var(--brass);
        color: #1a1204;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition:
          transform 0.3s var(--ease),
          box-shadow 0.3s;
      }
      .map-btn:hover {
        box-shadow: 0 8px 22px -8px rgba(217, 164, 65, 0.8);
      }
      .map-btn:active {
        transform: scale(0.96);
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 44px 20px 72px;
      }
      .eyebrow {
        margin: 0 0 10px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--brass);
      }
      h1 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(28px, 6vw, 44px);
        line-height: 1.12;
        letter-spacing: -0.015em;
      }
      .lead {
        margin: 16px 0 0;
        font-size: 17px;
        color: var(--mute);
      }
      .card {
        margin-top: 16px;
        padding: 22px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        animation: rise 0.7s var(--ease) backwards;
        animation-delay: calc(var(--k, 0) * 80ms);
      }
      .card h2 {
        margin: 0 0 8px;
        font-family: "Fraunces", Georgia, serif;
        font-size: 21px;
      }
      .card p {
        margin: 8px 0 0;
        color: var(--mute);
      }
      .card ul {
        margin: 10px 0 0;
        padding-left: 20px;
        color: var(--mute);
      }
      .card li {
        margin: 4px 0;
      }
      .card b {
        color: var(--text);
      }
      .steps {
        list-style: none;
        counter-reset: s;
        margin: 20px 0 0;
        padding: 0;
      }
      .steps li {
        counter-increment: s;
        position: relative;
        margin-top: 14px;
        padding: 20px 20px 20px 70px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
        animation: rise 0.7s var(--ease) backwards;
        animation-delay: calc(var(--k, 0) * 80ms);
      }
      .steps li::before {
        content: counter(s);
        position: absolute;
        left: 20px;
        top: 20px;
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: var(--brass);
        color: #1a1204;
        font-weight: 700;
      }
      .steps h2 {
        margin: 0;
        font-family: "Fraunces", Georgia, serif;
        font-size: 19px;
      }
      .steps p {
        margin: 6px 0 0;
        color: var(--mute);
      }
      .dot {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-right: 8px;
        vertical-align: -1px;
      }
      .note {
        margin-top: 16px;
        padding: 16px 18px;
        border-left: 3px solid var(--brass);
        border-radius: 0 12px 12px 0;
        background: var(--card);
        color: var(--mute);
        font-size: 15px;
      }
      .cta {
        display: inline-block;
        margin-top: 26px;
        padding: 14px 22px;
        border-radius: 14px;
        background: var(--text);
        color: var(--bg);
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 0.3s var(--ease),
          box-shadow 0.3s;
      }
      .cta:hover {
        box-shadow: 0 12px 28px -12px rgba(0, 0, 0, 0.6);
      }
      .cta:active {
        transform: scale(0.97);
      }
      footer {
        max-width: 760px;
        margin: 0 auto;
        padding: 0 20px calc(40px + env(safe-area-inset-bottom));
        color: var(--mute);
        font-size: 13px;
      }

      .layer {
        margin-top: 14px;
        padding: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: var(--card);
      }
      .card .layer {
        background: transparent;
      }
      .layer h3 {
        margin: 0 0 10px;
        font-family: "Fraunces", Georgia, serif;
        font-size: 17px;
      }
      .item {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.18);
        font-size: 14.5px;
        color: var(--mute);
      }
      [data-theme="light"] .item {
        background: rgba(10, 22, 40, 0.05);
      }
      .item span:first-child {
        flex: 1;
      }
      .b {
        flex: none;
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .b.built {
        background: rgba(43, 255, 136, 0.15);
        color: #2bff88;
      }
      .b.test {
        background: rgba(217, 164, 65, 0.2);
        color: #d9a441;
      }
      .b.plan {
        background: rgba(159, 176, 200, 0.18);
        color: var(--mute);
      }
      [data-theme="light"] .b.built {
        background: rgba(11, 143, 74, 0.12);
        color: #0b8f4a;
      }
      [data-theme="light"] .b.test {
        color: #9a6b10;
      }
      .down {
        display: grid;
        place-items: center;
        height: 34px;
        color: var(--brass);
      }
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .two-col .layer {
        margin-top: 0;
      }
      .verify {
        display: block;
        margin: 12px auto 0;
        width: max-content;
        padding: 10px 24px;
        border: 1.5px solid var(--brass);
        border-radius: 999px;
        color: var(--brass);
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .tbl {
        margin-top: 12px;
        overflow-x: auto;
        border: 1px solid var(--line);
        border-radius: 14px;
      }
      table {
        width: 100%;
        min-width: 560px;
        border-collapse: collapse;
        font-size: 14px;
      }
      th,
      td {
        padding: 12px 14px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
        color: var(--mute);
      }
      th {
        color: var(--text);
        font-weight: 600;
        background: var(--card);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      code {
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.92em;
        color: var(--brass);
      }
      @media (max-width: 640px) {
        .two-col {
          grid-template-columns: 1fr;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      @media (max-width: 560px) {
        .brand span {
          display: none;
        }
        main {
          padding-top: 32px;
        }
        .steps li {
          padding: 18px 16px 18px 62px;
        }
        .steps li::before {
          left: 16px;
          top: 18px;
        }
        .card {
          padding: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      .srch {
        position: relative;
        display: block;
      }
      .srch svg {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--mute);
        pointer-events: none;
      }
      .srch input {
        width: 100%;
        height: 46px;
        padding: 0 14px 0 42px;
        font: inherit;
        font-size: 15px;
        color: var(--text);
        background: var(--card);
        border: 1.5px solid var(--line);
        border-radius: 12px;
        transition:
          border-color 0.25s,
          box-shadow 0.25s;
      }
      .srch input:focus {
        outline: none;
        border-color: var(--brass);
        box-shadow: 0 0 0 4px rgba(217, 164, 65, 0.16);
      }
      .act {
        flex: 1;
        padding: 10px 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 13.5px;
        font-weight: 600;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
        transition:
          border-color 0.25s,
          background 0.25s,
          transform 0.25s var(--ease);
      }
      .act:hover {
        border-color: var(--brass);
        background: rgba(217, 164, 65, 0.08);
      }
      .act:active {
        transform: scale(0.97);
      }
      .sk {
        height: 176px;
        border-radius: 18px;
        background: linear-gradient(
          90deg,
          var(--card),
          rgba(255, 255, 255, 0.1),
          var(--card)
        );
        background-size: 200% 100%;
        animation: sh 1.3s linear infinite;
      }
      @keyframes sh {
        to {
          background-position: -200% 0;
        }
      }
      .code {
        font-family: "IBM Plex Mono", monospace;
        font-size: 14px;
        color: var(--brass);
      }
      main.wide {
        max-width: 1040px;
      }
      .mono-h {
        margin: 0;
        font-family: "IBM Plex Mono", monospace;
        font-size: clamp(22px, 5vw, 34px);
        color: var(--brass);
        letter-spacing: 0;
      }
      .rhead {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        align-items: flex-end;
      }
      .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .acts .act {
        flex: none;
        padding: 10px 16px;
      }
      .acts .act.primary {
        background: var(--brass);
        border-color: var(--brass);
        color: #1a1204;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 22px;
      }
      .tile {
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        animation: rise 0.6s var(--ease) backwards;
        animation-delay: calc(var(--k, 0) * 60ms);
      }
      .tile span {
        font-size: 12px;
        color: var(--mute);
      }
      .tile b {
        display: block;
        margin-top: 4px;
        font-family: "Fraunces", Georgia, serif;
        font-size: 25px;
        line-height: 1.15;
        word-break: break-word;
      }
      .tile b.m {
        font-family: "IBM Plex Mono", monospace;
        font-size: 15.5px;
        font-weight: 500;
      }
      .tile small {
        display: block;
        margin-top: 2px;
        font-size: 12.5px;
        color: var(--mute);
      }
      #rmap {
        height: 380px;
        margin-top: 12px;
        border-radius: 14px;
        overflow: hidden;
        background: #0d1b2e;
      }
      .cn span {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #d9a441;
        color: #1a1204;
        font:
          600 12px "Public Sans",
          sans-serif;
        border: 2px solid #fff;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
      .hash {
        font-family: "IBM Plex Mono", monospace;
        font-size: 12.5px;
        word-break: break-all;
        color: var(--text);
      }
      .thumbs {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .thumbs figure {
        margin: 0;
        width: 150px;
      }
      .thumbs img {
        width: 150px;
        height: 110px;
        object-fit: cover;
        border-radius: 10px;
        border: 1px solid var(--line);
      }
      .thumbs figcaption {
        margin-top: 4px;
        font-size: 12px;
        color: var(--mute);
      }
      .plist {
        margin-top: 14px;
        max-height: 62vh;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
      }
      .pitem {
        display: grid;
        grid-template-columns: 210px 1fr auto;
        gap: 12px;
        align-items: center;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line);
        color: var(--text);
        text-decoration: none;
        transition:
          background 0.25s,
          padding-left 0.3s var(--ease);
        animation: rise 0.5s var(--ease) backwards;
        animation-delay: calc(var(--k, 0) * 35ms);
      }
      .pitem:hover {
        background: rgba(217, 164, 65, 0.08);
        padding-left: 22px;
      }
      .pitem:last-child {
        border-bottom: 0;
      }
      .pitem small {
        color: var(--mute);
      }
      .empty {
        padding: 40px 16px;
        text-align: center;
        color: var(--mute);
      }
      @media (max-width: 640px) {
        .tiles {
          grid-template-columns: repeat(2, 1fr);
        }
        .pitem {
          grid-template-columns: 1fr auto;
        }
        .pitem small {
          display: none;
        }
        #rmap {
          height: 300px;
        }
      }
      @media print {
        html[data-theme] {
          --bg: #fff;
          --text: #111;
          --mute: #444;
          --line: #bbb;
          --card: #fff;
        }
        .top,
        .acts,
        .noprint,
        .leaflet-control-zoom {
          display: none !important;
        }
        body {
          background: #fff;
        }
        main {
          padding: 0;
          max-width: none;
        }
        .card,
        .tile {
          animation: none;
          break-inside: avoid;
        }
        .b {
          background: none !important;
          color: #111 !important;
          border: 1px solid #999;
        }
        #rmap {
          height: 320px;
        }
        * {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        footer {
          padding-bottom: 0;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/" aria-label="Back to the map">
        <svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true">
          <polygon
            points="8,12 34,7 37,32 11,37"
            fill="rgba(217,164,65,.18)"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linejoin="round"
          />
          <circle cx="8" cy="12" r="3.6" fill="#D9A441" />
          <circle cx="34" cy="7" r="3.6" fill="#D9A441" />
          <circle cx="37" cy="32" r="3.6" fill="#D9A441" />
          <circle cx="11" cy="37" r="3.6" fill="#D9A441" />
        </svg>
        <span>SABAGeo</span>
      </a>
      <nav aria-label="Pages">
        <a href="/registry">Registry</a
        ><a href="/report" class="on" aria-current="page">Report</a
        ><a href="/about">About us</a><a href="/how-it-works">How it works</a
        ><a href="/architecture">Architecture</a>
      </nav>
      <a class="map-btn" href="/">Open map</a>
    </header>
    <main class="wide">
      <div id="app">
        <div class="sk" style="height: 220px; margin-top: 30px"></div>
      </div>
    </main>
    <footer>
      SABAGeo Land Registry. A research prototype from the Nigerian Army
      University Biu.
    </footer>
    <script>
      (() => {
        const app = document.getElementById("app");
        const fmt = (n, d = 2) =>
          Number(n).toLocaleString("en", {
            minimumFractionDigits: d,
            maximumFractionDigits: d,
          });
        const esc = (s) =>
          String(s == null ? "" : s).replace(
            /[&<>"]/g,
            (c) =>
              ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
          );
        const dms = (d) => {
          const t = Math.round(d * 3600) % 1296000,
            D = Math.floor(t / 3600),
            M = Math.floor((t % 3600) / 60),
            S = t % 60;
          return (
            String(D).padStart(3, "0") +
            "°" +
            String(M).padStart(2, "0") +
            "′" +
            String(S).padStart(2, "0") +
            "″"
          );
        };
        const code = decodeURIComponent(
          (location.pathname.match(/^\/report\/(.+?)\/?$/) || [])[1] || "",
        );
        code ? showReport(code) : showPicker();

        function showPicker() {
          app.innerHTML =
            '<p class="eyebrow">Parcel report</p><h1>Generate a parcel report</h1><p class="lead">Choose a registered plot to generate its perimeter, area, corner coordinates and map on one printable page.</p>' +
            '<label class="srch" style="margin-top:22px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="rq" type="search" placeholder="Search by title code, region or label" autocomplete="off"></label><div class="plist" id="rlist"></div>';
          fetch("/api/registry")
            .then((r) => r.json())
            .then((rows) => {
              const reg = rows.filter((p) => p.status !== "reserved");
              const draw = () => {
                const q = document
                  .getElementById("rq")
                  .value.trim()
                  .toLowerCase();
                const hits = reg.filter(
                  (p) =>
                    !q ||
                    [p.code, p.region_name, p.label]
                      .join(" ")
                      .toLowerCase()
                      .includes(q),
                );
                document.getElementById("rlist").innerHTML = hits.length
                  ? hits
                      .map(
                        (p, i) =>
                          '<a class="pitem" style="--k:' +
                          Math.min(i, 12) +
                          '" href="/report/' +
                          encodeURIComponent(p.code) +
                          '"><span class="code">' +
                          p.code +
                          "</span><small>" +
                          esc(p.region_name) +
                          (p.label ? " | " + esc(p.label) : "") +
                          "</small><span>" +
                          fmt(p.area_m2, 0) +
                          " m²</span></a>",
                      )
                      .join("")
                  : '<p class="empty">No plots match.</p>';
              };
              document.getElementById("rq").addEventListener("input", draw);
              draw();
            })
            .catch(() => {
              document.getElementById("rlist").innerHTML =
                '<p class="empty">Could not load the plots. Please refresh.</p>';
            });
        }

        const tile = (label, value, small, k, mono) =>
          '<div class="tile" style="--k:' +
          k +
          '"><span>' +
          label +
          "</span><b" +
          (mono ? ' class="m"' : "") +
          ">" +
          value +
          "</b>" +
          (small ? "<small>" + small + "</small>" : "") +
          "</div>";

        async function showReport(code) {
          let d;
          try {
            const r = await fetch(
              "/plots/" + encodeURIComponent(code) + "/report",
            );
            d = await r.json();
            if (!r.ok) throw new Error("x");
          } catch (e) {
            app.innerHTML =
              '<p class="eyebrow">Parcel report</p><h1>Plot not found</h1><p class="lead">We could not find <b>' +
              esc(code) +
              '</b>. It may be a reserved slot, or the code may be wrong.</p><a class="cta" href="/report">Choose another plot</a>';
            return;
          }
          const E = d.corners_utm,
            W = d.corners_wgs;
          const segs = E.map((c, i) => {
            const n = E[(i + 1) % E.length],
              dE = n[0] - c[0],
              dN = n[1] - c[1];
            return {
              a: i + 1,
              b: ((i + 1) % E.length) + 1,
              len: Math.hypot(dE, dN),
              brg: ((Math.atan2(dE, dN) * 180) / Math.PI + 360) % 360,
            };
          });
          const tag = {
            DISJOINT_NODE: "DISJOINT",
            ADJOINING_CLUSTER: "ADJOINING",
          }[d.cluster_type];
          const when = new Date().toLocaleString("en-GB", {
            dateStyle: "long",
            timeStyle: "short",
          });
          const reg = d.registered_at
            ? new Date(d.registered_at).toLocaleDateString("en-GB", {
                dateStyle: "long",
              })
            : "n/a";
          const led = d.ledger
            ? "<p>Ledger record <b>" +
              d.ledger.record_id +
              "</b>, written " +
              new Date(d.ledger.recorded_at).toLocaleString("en-GB", {
                dateStyle: "medium",
                timeStyle: "short",
              }) +
              '.</p><p class="hash">' +
              d.ledger.hash +
              "</p>" +
              (d.anchor
                ? '<p><span class="b test">Test network</span> Covered by a Polygon anchor from ' +
                  new Date(d.anchor.anchored_at).toLocaleDateString("en-GB", {
                    dateStyle: "medium",
                  }) +
                  '. <a class="noprint" href="' +
                  d.anchor.url +
                  '" target="_blank" rel="noopener" style="color:var(--brass)">View on PolygonScan</a></p>'
                : '<p><span class="b plan">Not anchored yet</span> This record has not been posted to Polygon.</p>')
            : "<p>This plot has no ledger record.</p>";
          const photos = d.photos.length
            ? '<div class="thumbs">' +
              d.photos
                .map(
                  (p) =>
                    '<figure><img loading="lazy" src="/photos/' +
                    p.id +
                    '" alt="Beacon photo"><figcaption>' +
                    (p.distance_m == null
                      ? "No GPS tag"
                      : fmt(p.distance_m, 1) + " m from the plot") +
                    "</figcaption></figure>",
                )
                .join("") +
              "</div>"
            : "<p>No beacon photos yet.</p>";

          app.innerHTML =
            '<div class="rhead"><div><p class="eyebrow">Parcel report</p><h1 class="mono-h">' +
            esc(d.title_code) +
            '</h1><p class="lead">' +
            esc(d.region) +
            (d.label ? " | " + esc(d.label) : "") +
            " | " +
            (d.source === "synthetic" ? "Synthetic data" : "Field data") +
            (tag ? " | " + tag : "") +
            "</p></div>" +
            '<div class="acts noprint"><button class="act primary" id="print">Print or save as PDF</button><a class="act" href="/?plot=' +
            encodeURIComponent(d.title_code) +
            '">View on map</a><button class="act" id="copylink">Copy link</button></div></div>' +
            '<div class="tiles">' +
            tile(
              "Area",
              fmt(d.area_m2) + " m²",
              fmt(d.area_m2 / 10000, 4) + " hectares",
              1,
            ) +
            tile(
              "Perimeter",
              fmt(d.perimeter_m) + " m",
              "True length on the ground",
              2,
            ) +
            tile("Corners", E.length, "Closed polygon", 3) +
            tile(
              "Centroid",
              d.centroid[0].toFixed(6) + ", " + d.centroid[1].toFixed(6),
              "Latitude, Longitude",
              4,
              true,
            ) +
            tile("Local UTM zone", d.utm_zone, "EPSG:" + d.utm_epsg, 5) +
            tile("Registered", reg, "Report made " + when, 6) +
            "</div>" +
            '<section class="card" style="--k:7"><h2>Map</h2><div id="rmap"></div></section>' +
            '<section class="card" style="--k:8"><h2>Boundary segments</h2><div class="tbl"><table><tr><th>Segment</th><th>Length (m)</th><th>Bearing from north</th></tr>' +
            segs
              .map(
                (s) =>
                  "<tr><td>" +
                  s.a +
                  " → " +
                  s.b +
                  "</td><td>" +
                  fmt(s.len) +
                  "</td><td>" +
                  dms(s.brg) +
                  "</td></tr>",
              )
              .join("") +
            "</table></div><p>Lengths and bearings are grid values in UTM zone " +
            d.utm_zone +
            ". They can differ from ground distances by a fraction of a percent.</p></section>" +
            '<section class="card" style="--k:9"><h2>Corner coordinates</h2><div class="tbl"><table><tr><th>Corner</th><th>Latitude</th><th>Longitude</th><th>Easting (m)</th><th>Northing (m)</th></tr>' +
            W.map(
              (c, i) =>
                "<tr><td>" +
                (i + 1) +
                "</td><td>" +
                c[0] +
                "</td><td>" +
                c[1] +
                "</td><td>" +
                fmt(E[i][0]) +
                "</td><td>" +
                fmt(E[i][1]) +
                "</td></tr>",
            ).join("") +
            "</table></div></section>" +
            '<section class="card" style="--k:10"><h2>Verification</h2>' +
            led +
            '<h2 style="margin-top:18px">Beacon photos</h2>' +
            photos +
            "</section>" +
            '<p class="note">This report was generated by the SABAGeo Land Registry prototype. It is not a legal land document.</p>';

          document.getElementById("print").onclick = () => window.print();
          document.getElementById("copylink").onclick = (e) => {
            const b = e.target,
              say = (m) => {
                b.textContent = m;
                setTimeout(() => (b.textContent = "Copy link"), 1500);
              };
            if (navigator.clipboard)
              navigator.clipboard.writeText(location.href).then(
                () => say("Copied"),
                () => say("Could not copy"),
              );
            else say("Could not copy");
          };

          const esri = (p, o) =>
            L.tileLayer(
              "https://server.arcgisonline.com/ArcGIS/rest/services/" +
                p +
                "/MapServer/tile/{z}/{y}/{x}",
              Object.assign({ maxZoom: 20, maxNativeZoom: 17 }, o),
            );
          const map = L.map("rmap", { scrollWheelZoom: false });
          map.attributionControl.setPrefix(false);
          esri("World_Imagery", {
            attribution: "Tiles © Esri, Maxar, Earthstar Geographics",
          }).addTo(map);
          esri("Reference/World_Boundaries_and_Places").addTo(map);
          const poly = L.geoJSON(d.geometry, {
            style: {
              color: "#d9a441",
              weight: 3,
              fillColor: "#d9a441",
              fillOpacity: 0.18,
            },
          }).addTo(map);
          map.fitBounds(poly.getBounds(), { padding: [50, 50], maxZoom: 19 });
          W.forEach((c, i) =>
            L.marker(c, {
              icon: L.divIcon({
                className: "cn",
                html: "<span>" + (i + 1) + "</span>",
                iconSize: [24, 24],
              }),
              interactive: false,
              keyboard: false,
            }).addTo(map),
          );
          L.control.scale({ imperial: false }).addTo(map);
        }
      })();
    </script>
  </body>
</html>
