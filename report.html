<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Parcel report | SABAGeo Land Registry</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpolygon points='8,12 34,7 37,32 11,37' fill='%23D9A441' fill-opacity='.4' stroke='%230A1628' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){}</script>
<style>
:root{--bg:#0a1628;--text:#f4f6fa;--mute:#9fb0c8;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.05);--brass:#d9a441;--clear:#2bff88;--flag:#ff2d4d;--ease:cubic-bezier(.22,.8,.2,1)}
[data-theme=light]{--bg:#f1f4f9;--text:#0a1628;--mute:#52627a;--line:rgba(10,22,40,.14);--card:rgba(10,22,40,.04)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:700}
nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto}
nav a{padding:9px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;transition:background .3s,color .3s}
@media (hover: hover) and (pointer: fine){nav a:hover{color:var(--text)}}
nav a.on{color:var(--text);background:var(--card)}
.map-btn{flex:none;padding:9px 14px;border-radius:999px;background:var(--brass);color:#1a1204;text-decoration:none;font-size:14px;font-weight:600;transition:transform .3s var(--ease),box-shadow .3s}
@media (hover: hover) and (pointer: fine){.map-btn:hover{box-shadow:0 8px 22px -8px rgba(217,164,65,.8)}}
.map-btn:active{transform:scale(.96)}
main{max-width:760px;margin:0 auto;padding:44px 20px 72px}
.eyebrow{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
h1{margin:0;font-family:"Fraunces",Georgia,serif;font-size:clamp(28px,6vw,44px);line-height:1.12;letter-spacing:-.015em}
.lead{margin:16px 0 0;font-size:17px;color:var(--mute)}
.card{margin-top:16px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);animation:rise .32s var(--ease) backwards;animation-delay:calc(var(--k,0)*40ms)}
.card h2{margin:0 0 8px;font-family:"Fraunces",Georgia,serif;font-size:21px}
.card p{margin:8px 0 0;color:var(--mute)}
.card ul{margin:10px 0 0;padding-left:20px;color:var(--mute)}
.card li{margin:4px 0}
.card b{color:var(--text)}
.steps{list-style:none;counter-reset:s;margin:20px 0 0;padding:0}
.steps li{counter-increment:s;position:relative;margin-top:14px;padding:20px 20px 20px 70px;border:1px solid var(--line);border-radius:18px;background:var(--card);animation:rise .32s var(--ease) backwards;animation-delay:calc(var(--k,0)*40ms)}
.steps li::before{content:counter(s);position:absolute;left:20px;top:20px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--brass);color:#1a1204;font-weight:700}
.steps h2{margin:0;font-family:"Fraunces",Georgia,serif;font-size:19px}
.steps p{margin:6px 0 0;color:var(--mute)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.note{margin-top:16px;padding:16px 18px;border-left:3px solid var(--brass);border-radius:0 12px 12px 0;background:var(--card);color:var(--mute);font-size:15px}
.cta{display:inline-block;margin-top:26px;padding:14px 22px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600;text-decoration:none;transition:transform .3s var(--ease),box-shadow .3s}
@media (hover: hover) and (pointer: fine){.cta:hover{box-shadow:0 12px 28px -12px rgba(0,0,0,.6)}}
.cta:active{transform:scale(.97)}
footer{max-width:760px;margin:0 auto;padding:0 20px calc(40px + env(safe-area-inset-bottom));color:var(--mute);font-size:13px}

.layer{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.card .layer{background:transparent}
.layer h3{margin:0 0 10px;font-family:"Fraunces",Georgia,serif;font-size:17px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.18);font-size:14.5px;color:var(--mute)}
[data-theme=light] .item{background:rgba(10,22,40,.05)}
.item span:first-child{flex:1}
.b{flex:none;display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b.built{background:rgba(43,255,136,.15);color:#2bff88}
.b.test{background:rgba(217,164,65,.2);color:#d9a441}
.b.plan{background:rgba(159,176,200,.18);color:var(--mute)}
[data-theme=light] .b.built{background:rgba(11,143,74,.12);color:#0b8f4a}
[data-theme=light] .b.test{color:#9a6b10}
.down{display:grid;place-items:center;height:34px;color:var(--brass)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two-col .layer{margin-top:0}
.verify{display:block;margin:12px auto 0;width:max-content;padding:10px 24px;border:1.5px solid var(--brass);border-radius:999px;color:var(--brass);font-weight:600;letter-spacing:.08em}
.tbl{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);color:var(--mute)}
th{color:var(--text);font-weight:600;background:var(--card)}
tr:last-child td{border-bottom:0}
code{font-family:"IBM Plex Mono",monospace;font-size:.92em;color:var(--brass)}
@media (max-width:640px){.two-col{grid-template-columns:1fr}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media (max-width:560px){.brand span{display:none}main{padding-top:32px}.steps li{padding:18px 16px 18px 62px}.steps li::before{left:16px;top:18px}.card{padding:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.srch{position:relative;display:block}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.srch input{width:100%;height:46px;padding:0 14px 0 42px;font:inherit;font-size:15px;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:12px;transition:border-color .25s,box-shadow .25s}
.srch input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 4px rgba(217,164,65,.16)}
.act{flex:1;padding:10px 8px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-size:13.5px;font-weight:600;text-align:center;text-decoration:none;cursor:pointer;transition:border-color .25s,background .25s,transform .25s var(--ease)}
@media (hover: hover) and (pointer: fine){.act:hover{border-color:var(--brass);background:rgba(217,164,65,.08)}}
.act:active{transform:scale(.97)}
.sk{height:176px;border-radius:18px;background:linear-gradient(90deg,var(--card),rgba(255,255,255,.1),var(--card));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.code{font-family:"IBM Plex Mono",monospace;font-size:14px;color:var(--brass)}
main.wide{max-width:1040px}
.mono-h{margin:0;font-family:"IBM Plex Mono",monospace;font-size:clamp(22px,5vw,34px);color:var(--brass);letter-spacing:0}
.rhead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-end}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .act{flex:none;padding:10px 16px}
.acts .act.primary{background:var(--brass);border-color:var(--brass);color:#1a1204}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.tile{padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--card);animation:rise .32s var(--ease) backwards;animation-delay:calc(var(--k,0)*40ms)}
.tile span{font-size:12px;color:var(--mute)}
.tile b{display:block;margin-top:4px;font-family:"Fraunces",Georgia,serif;font-size:25px;line-height:1.15;word-break:break-word}
.tile b.m{font-family:"IBM Plex Mono",monospace;font-size:15.5px;font-weight:500}
.tile small{display:block;margin-top:2px;font-size:12.5px;color:var(--mute)}
#rmap{height:380px;margin-top:12px;border-radius:14px;overflow:hidden;background:#0d1b2e}
.cn span{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#d9a441;color:#1a1204;font:600 12px "Public Sans",sans-serif;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.hash{font-family:"IBM Plex Mono",monospace;font-size:12.5px;word-break:break-all;color:var(--text)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.thumbs figure{margin:0;width:150px}
.thumbs img{width:150px;height:110px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.thumbs figcaption{margin-top:4px;font-size:12px;color:var(--mute)}
.plist{margin-top:14px;max-height:62vh;overflow-y:auto;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.pitem{display:grid;grid-template-columns:210px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);color:var(--text);text-decoration:none;transition:background .25s,padding-left .3s var(--ease);animation:rise .32s var(--ease) backwards;animation-delay:calc(var(--k,0)*35ms)}
@media (hover: hover) and (pointer: fine){.pitem:hover{background:rgba(217,164,65,.08);padding-left:22px}}
.pitem:last-child{border-bottom:0}
.pitem small{color:var(--mute)}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}.pitem{grid-template-columns:1fr auto}.pitem small{display:none}#rmap{height:300px}}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.duo .card{margin-top:16px}
.shape{display:block;width:100%;height:auto;margin-top:8px;color:var(--text)}
.shape .poly{fill:rgba(217,164,65,.16);stroke:#d9a441;stroke-width:2.5;stroke-linejoin:round}
.shape .len{font:600 12.5px "IBM Plex Mono",monospace;fill:currentColor}
.shape .cnr{fill:#d9a441;stroke:#fff;stroke-width:2}
.shape .cnt{font:700 11px "Public Sans",sans-serif;fill:#1a1204}
.shape .area{font:700 15px "Fraunces",Georgia,serif;fill:currentColor}
.shape .tiny{font:600 11px "Public Sans",sans-serif;fill:currentColor}
.shape .ln{stroke:currentColor;stroke-width:2}
.printhead{display:none}
@media (max-width:760px){.duo{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:12mm}
  html[data-theme]{--bg:#fff;--text:#111;--mute:#444;--line:#bbb;--card:#fff}
  .top,.acts,.noprint,.leaflet-control-zoom{display:none!important}
  body{background:#fff;font-size:12px}main{padding:0;max-width:none}
  .printhead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:10px;margin-bottom:6px;border-bottom:2px solid #d9a441}
  .printhead b{font-family:"Fraunces",Georgia,serif;font-size:20px}
  .printhead small{display:block;color:#444;font-size:11px}
  .eyebrow{display:none}
  .rhead h1{font-size:22px}.lead{font-size:13px;margin-top:4px}
  .tiles{grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}.tile{padding:8px}.tile b{font-size:15px}.tile b.m{font-size:11px}.tile small{font-size:10px}
  .card,.tile{animation:none;break-inside:avoid}.card{padding:12px;margin-top:10px}.card h2{font-size:15px}
  .duo{grid-template-columns:1fr 1fr;gap:10px}
  .pduo{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:start}
  .pduo .card p{font-size:10px}
  .note{font-size:11px;padding:8px 12px;margin-top:10px}
  .b{background:none!important;color:#111!important;border:1px solid #999}
  #rmap{height:195px}
  .shape{max-height:195px}
  .tile:nth-child(6) small{display:none}
  .tile small{font-size:9px}
  .tiles .tile b{font-size:14px}
  .rhead{margin:0}
  .card h2{margin-bottom:4px}
  .hash{font-size:9.5px}
  .card p{margin-top:4px}
  .thumbs img{width:90px;height:66px}
  .tbl table{min-width:0;font-size:11px}.tbl th,.tbl td{padding:5px 8px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  footer{display:none}
}
</style>

<body>
<header class="top">
  <a class="brand" href="/" aria-label="Back to the map">
    <svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true"><polygon points="8,12 34,7 37,32 11,37" fill="rgba(217,164,65,.18)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="8" cy="12" r="3.6" fill="#D9A441"/><circle cx="34" cy="7" r="3.6" fill="#D9A441"/><circle cx="37" cy="32" r="3.6" fill="#D9A441"/><circle cx="11" cy="37" r="3.6" fill="#D9A441"/></svg>
    <span>SABAGeo</span>
  </a>
  <nav aria-label="Pages"><a href="/registry" >Registry</a><a href="/register-plot" >Register plot</a><a href="/report" class="on" aria-current="page">Report</a><a href="/about" >About us</a><a href="/how-it-works" >How it works</a><a href="/architecture" >Architecture</a></nav>
  <a class="map-btn" href="/">Open map</a>
</header>
<script src="/static/site.js"></script>
<main class="wide">
<div id="app"><div class="sk" style="height:220px;margin-top:30px"></div></div>
</main>
<footer>SABAGeo Land Registry. A research prototype from the Nigerian Army University Biu.</footer>
<script>
(() => {
  const app = document.getElementById("app");
  const fmt = (n, d = 2) => Number(n).toLocaleString("en", { minimumFractionDigits: d, maximumFractionDigits: d });
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dms = (d) => { const t = Math.round(d * 3600) % 1296000, D = Math.floor(t / 3600), M = Math.floor((t % 3600) / 60), S = t % 60; return String(D).padStart(3, "0") + "°" + String(M).padStart(2, "0") + "′" + String(S).padStart(2, "0") + "″"; };
  const code = decodeURIComponent((location.pathname.match(/^\/report\/(.+?)\/?$/) || [])[1] || "");
  code ? showReport(code) : showPicker();

  function showPicker() {
    app.innerHTML = '<p class="eyebrow">Parcel report</p><h1>Generate a parcel report</h1><p class="lead">Choose a registered plot to generate its perimeter, area, corner coordinates and map on one printable page.</p>' +
      '<label class="srch" style="margin-top:22px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="rq" type="search" placeholder="Search by title code, region or label" autocomplete="off"></label><div class="plist" id="rlist"></div>';
    fetch("/api/registry").then((r) => r.json()).then((rows) => {
      const reg = rows.filter((p) => p.status !== "reserved");
      const draw = () => {
        const q = document.getElementById("rq").value.trim().toLowerCase();
        const hits = reg.filter((p) => !q || [p.code, p.region_name, p.label].join(" ").toLowerCase().includes(q));
        document.getElementById("rlist").innerHTML = hits.length
          ? hits.map((p, i) => '<a class="pitem" style="--k:' + Math.min(i, 12) + '" href="/report/' + encodeURIComponent(p.code) + '"><span class="code">' + p.code + "</span><small>" + esc(p.region_name) + (p.label ? " | " + esc(p.label) : "") + "</small><span>" + fmt(p.area_m2, 0) + " m²</span></a>").join("")
          : '<p class="empty">No plots match.</p>';
      };
      document.getElementById("rq").addEventListener("input", draw);
      draw();
    }).catch(() => { document.getElementById("rlist").innerHTML = '<p class="empty">Could not load the plots. Please refresh.</p>'; });
  }

  /* a clean plan drawing of the plot: side lengths, numbered corners, north arrow and scale bar */
  function shapeSvg(E, segs, area) {
    const W = 560, H = 400, pad = 64;
    const xs = E.map((c) => c[0]), ys = E.map((c) => c[1]);
    const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
    const k = Math.min((W - 2 * pad) / Math.max(maxx - minx, 1e-6), (H - 2 * pad) / Math.max(maxy - miny, 1e-6));
    const ox = (W - (maxx - minx) * k) / 2, oy = (H - (maxy - miny) * k) / 2;
    const P = E.map((c) => [ox + (c[0] - minx) * k, H - (oy + (c[1] - miny) * k)]);
    const cx = P.reduce((a, p) => a + p[0], 0) / P.length, cy = P.reduce((a, p) => a + p[1], 0) / P.length;
    let out = '<polygon class="poly" points="' + P.map((p) => p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ") + '"/>';
    segs.forEach((sg, i) => {
      const a = P[i], b = P[(i + 1) % P.length], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
      let ang = (Math.atan2(b[1] - a[1], b[0] - a[0]) * 180) / Math.PI;
      if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
      const dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy) || 1;
      const lx = mx + (dx / d) * 16, ly = my + (dy / d) * 16;
      out += '<text class="len" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle" dominant-baseline="middle" transform="rotate(' + ang.toFixed(1) + " " + lx.toFixed(1) + " " + ly.toFixed(1) + ')">' + fmt(sg.len) + " m</text>";
    });
    P.forEach((p, i) => {
      const dx = p[0] - cx, dy = p[1] - cy, d = Math.hypot(dx, dy) || 1, qx = p[0] + (dx / d) * 4, qy = p[1] + (dy / d) * 4;
      out += '<circle class="cnr" cx="' + qx.toFixed(1) + '" cy="' + qy.toFixed(1) + '" r="10"/><text class="cnt" x="' + qx.toFixed(1) + '" y="' + qy.toFixed(1) + '" text-anchor="middle" dominant-baseline="central">' + (i + 1) + "</text>";
    });
    out += '<text class="area" x="' + cx.toFixed(1) + '" y="' + cy.toFixed(1) + '" text-anchor="middle" dominant-baseline="middle">' + fmt(area) + " m²</text>";
    // north arrow
    out += '<g transform="translate(' + (W - 34) + ',40)"><path d="M0,-22 L9,8 L0,2 L-9,8 Z" fill="currentColor"/><text class="tiny" x="0" y="24" text-anchor="middle">N</text></g>';
    // scale bar: a round length about a quarter of the drawing wide
    const want = (W * 0.25) / k, nice = [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000].reduce((b, n) => (n <= want ? n : b), 1);
    const sw = nice * k, sx = 24, sy = H - 22;
    out += '<line class="ln" x1="' + sx + '" y1="' + sy + '" x2="' + (sx + sw).toFixed(1) + '" y2="' + sy + '"/><line class="ln" x1="' + sx + '" y1="' + (sy - 6) + '" x2="' + sx + '" y2="' + (sy + 6) + '"/><line class="ln" x1="' + (sx + sw).toFixed(1) + '" y1="' + (sy - 6) + '" x2="' + (sx + sw).toFixed(1) + '" y2="' + (sy + 6) + '"/>' +
      '<text class="tiny" x="' + (sx + sw / 2).toFixed(1) + '" y="' + (sy - 10) + '" text-anchor="middle">' + nice + " m</text>";
    return '<svg class="shape" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Plan drawing of the plot with side lengths">' + out + "</svg>";
  }

  const tile = (label, value, small, k, mono) => '<div class="tile" style="--k:' + k + '"><span>' + label + "</span><b" + (mono ? ' class="m"' : "") + ">" + value + "</b>" + (small ? "<small>" + small + "</small>" : "") + "</div>";

  async function showReport(code) {
    let d;
    try {
      const r = await fetch("/plots/" + encodeURIComponent(code) + "/report");
      d = await r.json();
      if (!r.ok) throw new Error("x");
    } catch (e) {
      app.innerHTML = '<p class="eyebrow">Parcel report</p><h1>Plot not found</h1><p class="lead">We could not find <b>' + esc(code) + '</b>. It may be a reserved slot, or the code may be wrong.</p><a class="cta" href="/report">Choose another plot</a>';
      return;
    }
    const E = d.corners_utm, W = d.corners_wgs;
    const segs = E.map((c, i) => {
      const n = E[(i + 1) % E.length], dE = n[0] - c[0], dN = n[1] - c[1];
      return { a: i + 1, b: ((i + 1) % E.length) + 1, len: Math.hypot(dE, dN), brg: ((Math.atan2(dE, dN) * 180) / Math.PI + 360) % 360 };
    });
    const tag = { DISJOINT_NODE: "DISJOINT", ADJOINING_CLUSTER: "ADJOINING" }[d.cluster_type];
    const when = new Date().toLocaleString("en-GB", { dateStyle: "long", timeStyle: "short" });
    const reg = d.registered_at ? new Date(d.registered_at).toLocaleDateString("en-GB", { dateStyle: "long" }) : "n/a";
    const led = d.ledger
      ? "<p>Ledger record <b>" + d.ledger.record_id + "</b>, written " + new Date(d.ledger.recorded_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) + '.</p><p class="hash">' + d.ledger.hash + "</p>" +
        (d.anchor ? '<p><span class="b test">Test network</span> Covered by a Polygon anchor from ' + new Date(d.anchor.anchored_at).toLocaleDateString("en-GB", { dateStyle: "medium" }) + '. <a class="noprint" href="' + d.anchor.url + '" target="_blank" rel="noopener" style="color:var(--brass)">View on PolygonScan</a></p>' : '<p><span class="b plan">Not anchored yet</span> This record has not been posted to Polygon.</p>') +
        (d.onchain && d.onchain.record_hash === d.ledger.hash ? '<p><span class="b test">Test network</span> Title record written to the SABAGeo smart contract. <a class="noprint" href="' + d.onchain.url + '" target="_blank" rel="noopener" style="color:var(--brass)">View the transaction</a></p>' : "")
      : "<p>This plot has no ledger record.</p>";
    const photos = d.photos.length
      ? '<div class="thumbs">' + d.photos.map((p) => '<figure><img loading="lazy" src="/photos/' + p.id + '" alt="Beacon photo"><figcaption>' + (p.distance_m == null ? "No GPS tag" : fmt(p.distance_m, 1) + " m from the plot") + "</figcaption></figure>").join("") + "</div>"
      : "<p>No beacon photos yet.</p>";

    const LOGO = '<svg width="34" height="34" viewBox="0 0 44 44" aria-hidden="true"><polygon points="8,12 34,7 37,32 11,37" fill="rgba(217,164,65,.18)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="8" cy="12" r="3.6" fill="#D9A441"/><circle cx="34" cy="7" r="3.6" fill="#D9A441"/><circle cx="37" cy="32" r="3.6" fill="#D9A441"/><circle cx="11" cy="37" r="3.6" fill="#D9A441"/></svg>';
    const owner = d.owner_name ? "Registered to <b>" + esc(d.owner_name) + "</b> (" + (d.owner_type === "corporate" ? "Corporate" : "Individual") + ")<br>" : "";
    app.innerHTML =
      '<div class="printhead"><div style="display:flex;align-items:center;gap:10px">' + LOGO + '<div><b>SABAGeo</b><small>Technology Limited · Land Registry</small></div></div><div style="text-align:right"><b style="font-size:15px">Parcel report</b><small>Printed ' + when + "</small></div></div>" +
      '<div class="rhead"><div><p class="eyebrow">Parcel report</p><h1 class="mono-h">' + esc(d.title_code) + '</h1><p class="lead">' + owner + esc(d.region) + (d.label ? " | " + esc(d.label) : "") + " | " + (d.source === "synthetic" ? "Synthetic data" : "Field data") + (tag ? " | " + tag : "") + "</p></div>" +
      '<div class="acts noprint"><button class="act primary" id="print">Print or save as PDF</button><a class="act" href="/?plot=' + encodeURIComponent(d.title_code) + '">View on map</a><button class="act" id="copylink">Copy link</button></div></div>' +
      '<div class="tiles">' +
      tile("Area", fmt(d.area_m2) + " m²", fmt(d.area_m2 / 10000, 4) + " hectares", 1) +
      tile("Perimeter", fmt(d.perimeter_m) + " m", "True length on the ground", 2) +
      tile("Corners", E.length, "Closed polygon", 3) +
      tile("Centroid", d.centroid[0].toFixed(6) + ", " + d.centroid[1].toFixed(6), "Latitude, Longitude", 4, true) +
      tile("Local UTM zone", d.utm_zone, "EPSG:" + d.utm_epsg, 5) +
      tile("Registered", reg, "Report made " + when, 6) + "</div>" +
      '<div class="duo"><section class="card" style="--k:7"><h2>Plot shape</h2>' + shapeSvg(E, segs, d.area_m2) + '<p>Side lengths in metres. Corners are numbered as in the tables below.</p></section>' +
      '<section class="card" style="--k:8"><h2>Map</h2><div id="rmap"></div></section></div>' +
      '<div class="pduo"><section class="card" style="--k:8"><h2>Boundary segments</h2><div class="tbl"><table><tr><th>Segment</th><th>Length (m)</th><th>Bearing from north</th></tr>' + segs.map((s) => "<tr><td>" + s.a + " → " + s.b + "</td><td>" + fmt(s.len) + "</td><td>" + dms(s.brg) + "</td></tr>").join("") + "</table></div><p>Lengths and bearings are grid values in UTM zone " + d.utm_zone + ". They can differ from ground distances by a fraction of a percent.</p></section>" +
      '<div><section class="card" style="--k:9"><h2>Corner coordinates</h2><div class="tbl"><table><tr><th>Corner</th><th>Latitude</th><th>Longitude</th><th>Easting (m)</th><th>Northing (m)</th></tr>' + W.map((c, i) => "<tr><td>" + (i + 1) + "</td><td>" + c[0] + "</td><td>" + c[1] + "</td><td>" + fmt(E[i][0]) + "</td><td>" + fmt(E[i][1]) + "</td></tr>").join("") + "</table></div></section>" +
      '<section class="card" style="--k:10"><h2>Verification</h2>' + led + '<div class="qrbox"><img src="/plots/' + encodeURIComponent(d.title_code) + '/qr.svg" alt="QR code to verify this title" width="104" height="104"><div><b>Scan to verify</b><small>Anyone can scan this to check the title is still registered and its record is intact.</small><a class="noprint" href="/verify/' + encodeURIComponent(d.title_code) + '">Open the check page</a></div></div>' + '<h2 style="margin-top:18px">Beacon photos</h2>' + photos + "</section></div></div>" +
      '<p class="note">This report was generated by the SABAGeo Land Registry prototype. It is not a legal land document.</p>';

    document.getElementById("print").onclick = () => window.print();
    document.getElementById("copylink").onclick = (e) => {
      const b = e.target, say = (m) => { b.textContent = m; setTimeout(() => (b.textContent = "Copy link"), 1500); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(() => say("Copied"), () => say("Could not copy")); else say("Could not copy");
    };

    const esri = (p, o) => L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/" + p + "/MapServer/tile/{z}/{y}/{x}", Object.assign({ maxZoom: 20, maxNativeZoom: 17 }, o));
    const map = L.map("rmap", { scrollWheelZoom: false });
    map.attributionControl.setPrefix(false);
    esri("World_Imagery", { attribution: "Tiles © Esri, Maxar, Earthstar Geographics" }).addTo(map);
    esri("Reference/World_Boundaries_and_Places").addTo(map);
    const poly = L.geoJSON(d.geometry, { style: { color: "#d9a441", weight: 3, fillColor: "#d9a441", fillOpacity: 0.18 } }).addTo(map);
    map.fitBounds(poly.getBounds(), { padding: [50, 50], maxZoom: 19 });
    W.forEach((c, i) => L.marker(c, { icon: L.divIcon({ className: "cn", html: "<span>" + (i + 1) + "</span>", iconSize: [24, 24] }), interactive: false, keyboard: false }).addTo(map));
    L.control.scale({ imperial: false }).addTo(map);
    // the printed page is a different size, so re-centre the map on the plot before printing
    const refit = () => { map.invalidateSize(); map.fitBounds(poly.getBounds(), { padding: [30, 30], maxZoom: 19, animate: false }); };
    window.addEventListener("beforeprint", refit);
    if (window.matchMedia) window.matchMedia("print").addEventListener("change", (e) => { if (e.matches) refit(); });
  }
})();
</script>
</body>
</html>
