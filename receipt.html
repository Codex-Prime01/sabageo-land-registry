<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payment receipt | SABAGeo Land Registry</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1628">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpolygon points='8,12 34,7 37,32 11,37' fill='%23D9A441' fill-opacity='.4' stroke='%230A1628' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"dark"}catch(e){}</script>
<style>
:root{--bg:#0a1628;--text:#f4f6fa;--mute:#9fb0c8;--line:rgba(255,255,255,.12);--card:rgba(255,255,255,.05);--brass:#d9a441;--clear:#2bff88;--flag:#ff2d4d;--ease:cubic-bezier(.22,.8,.2,1)}
[data-theme=light]{--bg:#f1f4f9;--text:#0a1628;--mute:#52627a;--line:rgba(10,22,40,.14);--card:rgba(10,22,40,.04)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--bg);background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:"Fraunces",Georgia,serif;font-size:19px;font-weight:700}
nav{margin-left:auto;display:flex;gap:4px;overflow-x:auto}
nav a{padding:9px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-size:14px;font-weight:600;white-space:nowrap;transition:background .3s,color .3s}
nav a:hover{color:var(--text)}
nav a.on{color:var(--text);background:var(--card)}
.map-btn{flex:none;padding:9px 14px;border-radius:999px;background:var(--brass);color:#1a1204;text-decoration:none;font-size:14px;font-weight:600;transition:transform .3s var(--ease),box-shadow .3s}
.map-btn:hover{box-shadow:0 8px 22px -8px rgba(217,164,65,.8)}
.map-btn:active{transform:scale(.96)}
main{max-width:760px;margin:0 auto;padding:44px 20px 72px}
.eyebrow{margin:0 0 10px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
h1{margin:0;font-family:"Fraunces",Georgia,serif;font-size:clamp(28px,6vw,44px);line-height:1.12;letter-spacing:-.015em}
.lead{margin:16px 0 0;font-size:17px;color:var(--mute)}
.card{margin-top:16px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--k,0)*80ms)}
.card h2{margin:0 0 8px;font-family:"Fraunces",Georgia,serif;font-size:21px}
.card p{margin:8px 0 0;color:var(--mute)}
.card ul{margin:10px 0 0;padding-left:20px;color:var(--mute)}
.card li{margin:4px 0}
.card b{color:var(--text)}
.steps{list-style:none;counter-reset:s;margin:20px 0 0;padding:0}
.steps li{counter-increment:s;position:relative;margin-top:14px;padding:20px 20px 20px 70px;border:1px solid var(--line);border-radius:18px;background:var(--card);animation:rise .7s var(--ease) backwards;animation-delay:calc(var(--k,0)*80ms)}
.steps li::before{content:counter(s);position:absolute;left:20px;top:20px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--brass);color:#1a1204;font-weight:700}
.steps h2{margin:0;font-family:"Fraunces",Georgia,serif;font-size:19px}
.steps p{margin:6px 0 0;color:var(--mute)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.note{margin-top:16px;padding:16px 18px;border-left:3px solid var(--brass);border-radius:0 12px 12px 0;background:var(--card);color:var(--mute);font-size:15px}
.cta{display:inline-block;margin-top:26px;padding:14px 22px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:600;text-decoration:none;transition:transform .3s var(--ease),box-shadow .3s}
.cta:hover{box-shadow:0 12px 28px -12px rgba(0,0,0,.6)}
.cta:active{transform:scale(.97)}
footer{max-width:760px;margin:0 auto;padding:0 20px calc(40px + env(safe-area-inset-bottom));color:var(--mute);font-size:13px}

.layer{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.card .layer{background:transparent}
.layer h3{margin:0 0 10px;font-family:"Fraunces",Georgia,serif;font-size:17px}
.item{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.18);font-size:14.5px;color:var(--mute)}
[data-theme=light] .item{background:rgba(10,22,40,.05)}
.item span:first-child{flex:1}
.b{flex:none;display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b.built{background:rgba(43,255,136,.15);color:#2bff88}
.b.test{background:rgba(217,164,65,.2);color:#d9a441}
.b.plan{background:rgba(159,176,200,.18);color:var(--mute)}
[data-theme=light] .b.built{background:rgba(11,143,74,.12);color:#0b8f4a}
[data-theme=light] .b.test{color:#9a6b10}
.down{display:grid;place-items:center;height:34px;color:var(--brass)}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.two-col .layer{margin-top:0}
.verify{display:block;margin:12px auto 0;width:max-content;padding:10px 24px;border:1.5px solid var(--brass);border-radius:999px;color:var(--brass);font-weight:600;letter-spacing:.08em}
.tbl{margin-top:12px;overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;min-width:560px;border-collapse:collapse;font-size:14px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);color:var(--mute)}
th{color:var(--text);font-weight:600;background:var(--card)}
tr:last-child td{border-bottom:0}
code{font-family:"IBM Plex Mono",monospace;font-size:.92em;color:var(--brass)}
@media (max-width:640px){.two-col{grid-template-columns:1fr}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (max-width:560px){.brand span{display:none}main{padding-top:32px}.steps li{padding:18px 16px 18px 62px}.steps li::before{left:16px;top:18px}.card{padding:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
<style>
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px;font-weight:600}
.fld small{font-size:12px;color:var(--mute)}
.fld input,.fld select{width:100%;height:46px;padding:0 14px;font:inherit;font-size:15px;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:12px;transition:border-color .25s,box-shadow .25s}
.fld select option{color:#0a1628;background:#fff}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 4px rgba(217,164,65,.16)}
.btnp{height:50px;padding:0 24px;border:0;border-radius:12px;background:var(--brass);color:#1a1204;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s var(--ease),box-shadow .3s,opacity .2s}
.btnp:hover{box-shadow:0 10px 24px -10px rgba(217,164,65,.8)}
.btnp:active{transform:scale(.97)}
.btnp:disabled{opacity:.6;cursor:progress}
.msg{margin:12px 0 0;font-size:14px;color:#ff5c77}
.b.bad{background:rgba(255,45,77,.15);color:#ff5c77}
.seal{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;animation:stamp .5s cubic-bezier(.2,1.4,.4,1) backwards}
.seal.ok{background:#2bff88;box-shadow:0 0 22px rgba(43,255,136,.55)}
.seal.no{background:#ff2d4d;box-shadow:0 0 22px rgba(255,45,77,.6)}
.seal svg{stroke:#05260f}
.seal.no svg{stroke:#fff}
@keyframes stamp{from{opacity:0;transform:scale(1.6) rotate(-12deg)}to{opacity:1;transform:none}}
.hidden{display:none!important}
@media (max-width:640px){.form{grid-template-columns:1fr}}
.mono{font-family:"IBM Plex Mono",monospace}
.rcpt{max-width:640px;margin:26px auto 0;padding:26px;border:1px solid var(--line);border-radius:20px;background:var(--card);animation:rise .6s var(--ease)}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.rc-brand{display:flex;align-items:center;gap:12px}
.rc-brand b{display:block;font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:24px;line-height:1.1}
.rc-brand small{display:block;color:var(--mute);font-size:12.5px;letter-spacing:.04em}
.rc-code{margin-top:20px;padding:16px 18px;border:2px dashed var(--brass);border-radius:14px;text-align:center}
.rc-code dt{font-size:12px;color:var(--mute)}
.rc-code dd{margin:6px 0 0;font-family:"IBM Plex Mono",monospace;font-size:clamp(20px,5vw,26px);letter-spacing:.06em;color:var(--brass);word-break:break-all}
.rc-code p{margin:8px 0 0;font-size:13px;color:var(--mute)}
.rc-state{display:flex;align-items:center;gap:12px}
.rc-state b{font-family:"Fraunces",Georgia,serif;font-size:20px}
.rc-state.ok b{color:#2bff88}
.rc-state.no b{color:#ff5c77}
[data-theme=light] .rc-state.ok b{color:#0b8f4a}
.rcpt h1{margin-top:18px;font-size:26px}
.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0 0}
.rc-grid div{min-width:0}
.rc-grid dt{font-size:12px;color:var(--mute)}
.rc-grid dd{margin:3px 0 0;word-break:break-word}
.rc-grid .big{font-family:"Fraunces",Georgia,serif;font-size:27px}
.rc-grid .full{grid-column:1/-1}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.act{padding:10px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .25s,background .25s}
.act:hover{border-color:var(--brass);background:rgba(217,164,65,.08)}
.act.go{padding:12px 22px;border:0;border-radius:999px;background:var(--brass);color:#1a1204;font-size:15px;font-weight:700;text-decoration:none}
.act.go:hover{filter:brightness(1.07);background:var(--brass)}
.sk{height:176px;border-radius:18px;background:linear-gradient(90deg,var(--card),rgba(255,255,255,.1),var(--card));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (max-width:640px){.rc-grid{grid-template-columns:1fr}.rcpt{padding:20px}}
@media print{html[data-theme]{--bg:#fff;--text:#111;--mute:#444;--line:#bbb;--card:#fff}.top,.acts,.noprint{display:none!important}body{background:#fff}main{padding:0}.rcpt{animation:none;border-color:#888}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}footer{padding-bottom:0}}
</style>
<link rel="stylesheet" href="/static/site.css" />
</head>
<body>
<header class="top">
  <a class="brand" href="/" aria-label="Back to the map">
    <svg width="30" height="30" viewBox="0 0 44 44" aria-hidden="true"><polygon points="8,12 34,7 37,32 11,37" fill="rgba(217,164,65,.18)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="8" cy="12" r="3.6" fill="#D9A441"/><circle cx="34" cy="7" r="3.6" fill="#D9A441"/><circle cx="37" cy="32" r="3.6" fill="#D9A441"/><circle cx="11" cy="37" r="3.6" fill="#D9A441"/></svg>
    <span>SABAGeo</span>
  </a>
  <nav aria-label="Pages"><a href="/registry" >Registry</a><a href="/register-plot" >Register plot</a><a href="/report" >Report</a><a href="/about" >About us</a><a href="/how-it-works" >How it works</a><a href="/architecture" >Architecture</a></nav>
  <a class="map-btn" href="/">Open map</a>
</header>
<script src="/static/site.js"></script>
<main class="">
<div id="app"><div class="sk" style="margin-top:30px"></div></div>
</main>
<footer>SABAGeo Land Registry. A research prototype from the Nigerian Army University Biu.</footer>
<script>
(() => {
  const app = document.getElementById("app");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const naira = (n) => new Intl.NumberFormat("en-NG", { style: "currency", currency: "NGN" }).format(n);
  const TICK = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const CROSS = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const m = location.pathname.match(/^\/receipt\/(.+?)\/?$/);
  const no0 = m ? decodeURIComponent(m[1]) : "";
  const v0 = new URLSearchParams(location.search).get("v") || "";
  // the login code is passed once, after "#", so it never reaches the server; then it is wiped from the address bar
  const code0 = new URLSearchParams(location.hash.slice(1)).get("code") || "";
  if (code0) history.replaceState(null, "", location.pathname + location.search);
  const LOGO = '<svg width="46" height="46" viewBox="0 0 44 44" aria-hidden="true"><polygon points="8,12 34,7 37,32 11,37" fill="rgba(217,164,65,.18)" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="8" cy="12" r="3.6" fill="#D9A441"/><circle cx="34" cy="7" r="3.6" fill="#D9A441"/><circle cx="37" cy="32" r="3.6" fill="#D9A441"/><circle cx="11" cy="37" r="3.6" fill="#D9A441"/></svg>';

  function form(msg, no, v) {
    app.innerHTML = '<p class="eyebrow">Payment receipt</p><h1>Verify a receipt</h1><p class="lead">Enter the receipt number and the verification code printed on the receipt.</p>' +
      (msg ? '<div class="rc-state no" style="margin:20px 0 0"><span class="seal no">' + CROSS + "</span><b>" + esc(msg) + "</b></div>" : "") +
      '<form class="card" id="vf" style="--k:1"><div class="form"><div class="fld"><label for="rn">Receipt number</label><input id="rn" value="' + esc(no || "") + '" placeholder="SABA-RCPT-2026-0001" autocomplete="off" required></div>' +
      '<div class="fld"><label for="rv">Verification code</label><input id="rv" value="' + esc(v || "") + '" placeholder="8 characters" autocomplete="off" required></div></div>' +
      '<button class="btnp" style="margin-top:14px" type="submit">Verify receipt</button></form>';
    document.getElementById("vf").addEventListener("submit", (e) => {
      e.preventDefault();
      const n = document.getElementById("rn").value.trim().toUpperCase(), c = document.getElementById("rv").value.trim().toUpperCase();
      history.replaceState(null, "", "/receipt/" + encodeURIComponent(n) + "?v=" + encodeURIComponent(c));
      load(n, c);
    });
  }

  async function load(no, v) {
    app.innerHTML = '<div class="sk" style="margin-top:30px"></div>';
    const headers = {}, k = sessionStorage.getItem("adminKey");
    if (k) headers["X-Admin-Key"] = k;
    try {
      const r = await fetch("/api/receipts/" + encodeURIComponent(no) + "?v=" + encodeURIComponent(v), { headers });
      const d = await r.json();
      if (!r.ok) { form(typeof d.detail === "string" ? d.detail : "Could not verify this receipt.", no, v); return; }
      show(d);
    } catch (e) { form("Could not reach the server. Please try again.", no, v); }
  }

  function show(d) {
    const ok = d.valid, when = new Date(d.issued_at).toLocaleString("en-GB", { dateStyle: "long", timeStyle: "short" });
    const until = d.code_expires ? new Date(d.code_expires).toLocaleDateString("en-GB", { dateStyle: "long" }) : null;
    const codeBox = code0
      ? '<dl class="rc-code"><dt>Your login code</dt><dd>' + esc(code0) + "</dd><p>Use it at Register New Plot" + (until ? ", until " + until : "") + ". Keep it private. SABAGeo does not keep a copy.</p></dl>"
      : '<dl class="rc-code"><dt>Your login code</dt><dd style="font-size:15px;letter-spacing:0">Given to you with this receipt</dd><p>For your safety, SABAGeo does not keep a copy. If you lose it, contact SABAGeo for a new one.</p></dl>';
    app.innerHTML = '<section class="rcpt"><div class="rc-top"><span class="rc-brand">' + LOGO + '<span><b>SABAGeo</b><small>TECHNOLOGY LIMITED · LAND REGISTRY</small></span></span><span class="rc-state ' + (ok ? "ok" : "no") + '"><span class="seal ' + (ok ? "ok" : "no") + '">' + (ok ? TICK : CROSS) + "</span><b>" + (ok ? "Receipt verified" : "Receipt void") + "</b></span></div>" +
      "<h1>Payment receipt</h1>" +
      '<dl class="rc-grid">' +
      '<div><dt>Receipt number</dt><dd class="mono">' + esc(d.receipt_no) + "</dd></div>" +
      "<div><dt>Date</dt><dd>" + when + "</dd></div>" +
      "<div><dt>Received from</dt><dd>" + esc(d.name) + " (" + (d.client_type === "corporate" ? "Corporate" : "Individual") + ")</dd></div>" +
      '<div><dt>Amount</dt><dd class="big">' + naira(d.amount_ngn) + "</dd></div>" +
      "<div><dt>Payment method</dt><dd>" + esc(d.method) + "</dd></div>" +
      '<div><dt>Payment reference</dt><dd class="mono">' + esc(d.reference) + "</dd></div>" +
      "<div><dt>Plan</dt><dd>" + esc(d.plan || (d.client_type === "corporate" ? "Corporate" : "Individual")) + "</dd></div>" +
      "<div><dt>Plots allowed</dt><dd>" + (d.plots_allowed ? d.plots_allowed : "No limit") + (until ? ", code valid until " + until : "") + "</dd></div>" +
      '<div><dt>Verification code</dt><dd class="mono">' + esc(d.verify_code || "") + "</dd></div>" +
      '<div class="full"><dt>For</dt><dd>Token fee for access to the SABAGeo platform: a login code to check and register land parcels</dd></div></dl>' +
      codeBox +
      '<p class="note" style="margin-top:20px">Anyone can check this receipt at ' + esc(location.host) + '/receipt with the receipt number and verification code. Issued by the SABAGeo Land Registry prototype. It is not a tax invoice.</p>' +
      '<div class="acts noprint">' +
      (code0 && ok ? '<a class="act go" href="/register-plot#code=' + encodeURIComponent(code0) + '">Start registering my plot →</a>' : "") +
      '<button class="act" id="pr">Print or save as PDF</button><button class="act" id="cl">Copy receipt link</button></div></section>';
    document.getElementById("pr").onclick = () => window.print();
    document.getElementById("cl").onclick = (e) => {
      const b = e.target, say = (t) => { b.textContent = t; setTimeout(() => (b.textContent = "Copy receipt link"), 1500); };
      navigator.clipboard ? navigator.clipboard.writeText(location.href).then(() => say("Copied"), () => say("Could not copy")) : say("Could not copy");
    };
  }

  no0 ? load(no0, v0) : form();
})();
</script>
</body>
</html>
